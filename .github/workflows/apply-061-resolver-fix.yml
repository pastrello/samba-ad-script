name: Apply Ubuntu resolver 0.6.1 fix

on:
  push:
    branches:
      - fix/ubuntu-resolved-port53-0.6.1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply resolver fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('scripts/lib/distro-ubuntu.sh')
          s = p.read_text()

          block = r'''ubuntu_port53_listeners() {
              ss -H -lntup 2>/dev/null | awk '$5 ~ /:53$/ {print}' || true
          }

          ubuntu_resolved_port53_listeners() {
              ubuntu_port53_listeners | grep -E 'systemd-resolv' || true
          }

          ubuntu_write_resolv_conf() {
              local dns_server="$1"
              local search_domain="${2:-}"

              rm -f /etc/resolv.conf
              {
                  if [[ -n "$search_domain" ]]; then
                      printf 'search %s\n' "$search_domain"
                  fi
                  printf 'nameserver %s\n' "$dns_server"
              } >/etc/resolv.conf
              chmod 644 /etc/resolv.conf
          }

          ubuntu_resolved_is_masked() {
              [[ "$(systemctl is-enabled systemd-resolved.service 2>/dev/null || true)" == "masked" ]]
          }

          ubuntu_disable_systemd_resolved_for_dc() {
              local dns_server="$1"
              local search_domain="${2:-}"
              local listeners

              warn "systemd-resolved continuou ocupando a porta 53; aplicando fallback controlado para DC dedicado."
              warn "O serviço será parado e mascarado; /etc/resolv.conf ficará sob controle do samba-ad-script."

              mkdir -p /etc/samba-ad

              if ! systemctl mask --now systemd-resolved.service >/dev/null 2>&1; then
                  systemctl stop systemd-resolved.service 2>/dev/null || true
                  systemctl disable systemd-resolved.service >/dev/null 2>&1 || true
                  systemctl mask systemd-resolved.service >/dev/null 2>&1 || \
                      die "Não foi possível mascarar systemd-resolved."
              fi

              sleep 1
              listeners="$(ubuntu_port53_listeners)"
              if [[ -n "$listeners" ]]; then
                  printf '%s\n' "$listeners" >&2
                  die "A porta 53 continua ocupada após parar systemd-resolved."
              fi

              ubuntu_write_resolv_conf "$dns_server" "$search_domain"
              printf '%s\n' "$(date -Is)" >/etc/samba-ad/systemd-resolved.disabled-by-samba-ad-script
              chmod 600 /etc/samba-ad/systemd-resolved.disabled-by-samba-ad-script
              ok "systemd-resolved desativado de forma controlada; porta 53 liberada para o Samba."
          }

          distro_prepare_dns_port() {
              info "Preparando porta 53 no Ubuntu"

              if [[ ! -e /etc/resolv.conf.pre-samba-ad ]]; then
                  cp -a /etc/resolv.conf /etc/resolv.conf.pre-samba-ad 2>/dev/null || true
              fi

              if ubuntu_resolved_is_masked; then
                  warn "systemd-resolved já está mascarado; usando resolver estático durante o provisionamento."
                  ubuntu_write_resolv_conf "$DNS_FORWARDER"
                  local preexisting
                  preexisting="$(ubuntu_port53_listeners)"
                  if [[ -n "$preexisting" ]]; then
                      printf '%s\n' "$preexisting" >&2
                      die "Porta 53 ocupada por outro serviço antes do provisionamento."
                  fi
                  return 0
              fi

              if systemctl cat systemd-resolved.service >/dev/null 2>&1; then
                  mkdir -p /etc/systemd/resolved.conf.d
                  rm -f /etc/systemd/resolved.conf.d/60-samba-ad.conf
                  cat >/etc/systemd/resolved.conf.d/99-samba-ad.conf <<EOF
          [Resolve]
          DNS=${DNS_FORWARDER}
          DNSStubListener=no
          DNSStubListenerExtra=
          EOF

                  systemctl enable --now systemd-resolved.service 2>/dev/null || true
                  systemctl restart systemd-resolved.service

                  # Durante build/provisionamento, consultas devem ir diretamente ao forwarder.
                  ubuntu_write_resolv_conf "$DNS_FORWARDER"
                  sleep 1

                  local listeners other
                  listeners="$(ubuntu_port53_listeners)"
                  if [[ -z "$listeners" ]]; then
                      ok "Stub DNS do systemd-resolved desativado; porta 53 liberada para o Samba."
                      return 0
                  fi

                  other="$(printf '%s\n' "$listeners" | grep -Ev 'systemd-resolv' || true)"
                  if [[ -n "$other" ]]; then
                      printf '%s\n' "$listeners" >&2
                      die "Porta 53 está ocupada por serviço diferente de systemd-resolved."
                  fi

                  warn "A configuração efetiva ainda deixou systemd-resolved na porta 53."
                  systemd-analyze cat-config systemd/resolved.conf 2>/dev/null | tail -n 120 || true
                  ubuntu_disable_systemd_resolved_for_dc "$DNS_FORWARDER"
              else
                  warn "systemd-resolved não foi detectado; usando /etc/resolv.conf estático."
                  ubuntu_write_resolv_conf "$DNS_FORWARDER"
                  local listeners
                  listeners="$(ubuntu_port53_listeners)"
                  if [[ -n "$listeners" ]]; then
                      printf '%s\n' "$listeners" >&2
                      die "Porta 53 já está ocupada antes do provisionamento."
                  fi
              fi
          }

          distro_enable_network_wait() {'''

          s, n = re.subn(r'distro_prepare_dns_port\(\) \{.*?\n\}\n\ndistro_enable_network_wait\(\) \{', block, s, count=1, flags=re.S)
          assert n == 1, 'prepare_dns_port block not found'

          block2 = r'''distro_configure_resolver_to_self() {
              if systemctl is-active --quiet systemd-resolved.service 2>/dev/null; then
                  mkdir -p /etc/systemd/resolved.conf.d
                  rm -f /etc/systemd/resolved.conf.d/60-samba-ad.conf
                  cat >/etc/systemd/resolved.conf.d/99-samba-ad.conf <<EOF
          [Resolve]
          DNS=${DC_IP}
          Domains=${AD_DNS_DOMAIN}
          DNSStubListener=no
          DNSStubListenerExtra=
          EOF
                  systemctl restart systemd-resolved.service
                  resolvectl flush-caches 2>/dev/null || true
                  sleep 1

                  if [[ -n "$(ubuntu_resolved_port53_listeners)" ]]; then
                      warn "systemd-resolved voltou a ocupar a porta 53 após configurar o DC como DNS."
                      ubuntu_disable_systemd_resolved_for_dc "$DC_IP" "$AD_DNS_DOMAIN"
                  fi
              fi

              ubuntu_write_resolv_conf "$DC_IP" "$AD_DNS_DOMAIN"

              if ! grep -Eq "^nameserver[[:space:]]+${DC_IP//./\\.}([[:space:]]|$)" /etc/resolv.conf; then
                  die "/etc/resolv.conf não aponta para o próprio DC após a configuração."
              fi
          }

          distro_prepare_ca_anchor() {'''

          s, n = re.subn(r'distro_configure_resolver_to_self\(\) \{.*?\n\}\n\ndistro_prepare_ca_anchor\(\) \{', block2, s, count=1, flags=re.S)
          assert n == 1, 'resolver_to_self block not found'

          block3 = r'''distro_run_extra_tests() {
              local resolved_listeners
              resolved_listeners="$(ubuntu_resolved_port53_listeners)"
              if [[ -n "$resolved_listeners" ]]; then
                  printf '%s\n' "$resolved_listeners" >&2
                  die "systemd-resolved está ocupando a porta 53 após o provisionamento."
              fi

              if ubuntu_resolved_is_masked; then
                  systemctl is-active --quiet systemd-resolved.service 2>/dev/null && \
                      die "systemd-resolved está ativo apesar de estar mascarado."
                  ok "Fallback Ubuntu ativo: systemd-resolved mascarado e fora da porta 53."
              else
                  ok "systemd-resolved permanece sem stub na porta 53."
              fi
          }

          distro_security_summary() {
              local aa="desconhecido"
              local resolver_status
              if systemctl is-active --quiet apparmor.service 2>/dev/null; then
                  aa="ativo"
              fi

              if ubuntu_resolved_is_masked; then
                  resolver_status="systemd-resolved mascarado pelo fallback controlado; resolver estático"
              else
                  resolver_status="systemd-resolved ativo com DNS stub desativado"
              fi

              cat <<EOF
          AppArmor:
            O instalador NÃO desativa AppArmor. Estado atual: ${aa}

          Resolver Ubuntu:
            ${resolver_status}.
            /etc/resolv.conf aponta para ${DC_IP}.
          EOF
          }'''

          s, n = re.subn(r'distro_run_extra_tests\(\) \{.*?\n\}\n\ndistro_security_summary\(\) \{.*?\n\}', block3, s, count=1, flags=re.S)
          assert n == 1, 'extra tests/security summary block not found'

          p.write_text(s)

          p = Path('scripts/install.sh')
          s = p.read_text().replace('installer 0.6\n', 'installer 0.6.1\n', 1).replace('INSTALLER_REVISION="0.6"', 'INSTALLER_REVISION="0.6.1"')
          p.write_text(s)

          p = Path('scripts/lib/common.sh')
          s = p.read_text().replace('INSTALLER_REVISION="${INSTALLER_REVISION:-0.6}"', 'INSTALLER_REVISION="${INSTALLER_REVISION:-0.6.1}"')
          p.write_text(s)

          p = Path('CHANGELOG.md')
          s = p.read_text()
          entry = '''## Installer 0.6.1 — 2026-09-05\n\n### Fixed\n- corrige o primeiro bug encontrado no teste end-to-end Ubuntu: `systemd-resolved` permanecia ocupando `127.0.0.53/54:53` mesmo após `DNSStubListener=no`;\n- usa drop-in local de alta prioridade `99-samba-ad.conf` e limpa `DNSStubListenerExtra`;\n- identifica o proprietário real da porta 53 antes de tomar qualquer ação;\n- quando apenas `systemd-resolved` insiste em manter a porta 53, aplica fallback controlado para DC dedicado: para/mascara o serviço e mantém `/etc/resolv.conf` estático;\n- se outro daemon DNS ocupar a porta 53, o instalador continua abortando com diagnóstico em vez de desativá-lo;\n- retomada de uma instalação 0.6 parcialmente executada continua suportada porque o formato de estado permanece v3.\n\n'''
          marker = '## Installer 0.6 — 2026-09-05\n'
          assert marker in s
          p.write_text(s.replace(marker, entry + marker, 1))

          p = Path('docs/UBUNTU.md')
          s = p.read_text()
          note = '''\n## Porta 53 e fallback do systemd-resolved\n\nO instalador tenta primeiro manter `systemd-resolved` ativo com `DNSStubListener=no`. Em algumas instalações Ubuntu observadas em laboratório, o daemon pode continuar mantendo `127.0.0.53:53` e `127.0.0.54:53` mesmo após o restart.\n\nA partir do installer 0.6.1, se **somente** `systemd-resolved` continuar ocupando a porta 53, o instalador aplica um fallback controlado adequado a um DC dedicado: para e mascara `systemd-resolved` e passa a manter `/etc/resolv.conf` diretamente. Antes do provisionamento ele aponta para o forwarder; depois, para o próprio IP do DC.\n\nSe qualquer outro daemon estiver usando a porta 53, a instalação aborta e mostra os listeners encontrados. O instalador não desativa serviços DNS desconhecidos automaticamente.\n'''
          if '## Porta 53 e fallback do systemd-resolved' not in s:
              s += note
          p.write_text(s)

          Path('tests/ubuntu-resolver-contract.sh').write_text(r'''#!/usr/bin/env bash
          set -Eeuo pipefail
          f="scripts/lib/distro-ubuntu.sh"
          grep -q '99-samba-ad.conf' "$f"
          grep -q 'DNSStubListener=no' "$f"
          grep -q 'DNSStubListenerExtra=' "$f"
          grep -q 'systemctl mask --now systemd-resolved.service' "$f"
          grep -q 'ubuntu_port53_listeners' "$f"
          grep -q 'systemd-resolved.disabled-by-samba-ad-script' "$f"
          echo '[OK] Ubuntu resolver fallback contract validated'
          ''')
          PY

          chmod +x tests/ubuntu-resolver-contract.sh
          bash -n scripts/install.sh
          bash -n scripts/lib/common.sh
          bash -n scripts/lib/distro-ubuntu.sh
          bash -n tests/ubuntu-resolver-contract.sh
          bash tests/platform-detection.sh
          bash tests/ubuntu-resolver-contract.sh

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/install.sh scripts/lib/common.sh scripts/lib/distro-ubuntu.sh CHANGELOG.md docs/UBUNTU.md tests/ubuntu-resolver-contract.sh
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: handle persistent systemd-resolved port 53 listeners"
          git push
