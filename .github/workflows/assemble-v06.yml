name: Assemble v0.6 payload

on:
  push:
    branches:
      - feature/multi-distro-installer-v0.6

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble payload
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .v06-payload/part00 ]]; then
            echo "Payload already assembled; nothing to do."
            exit 0
          fi

          cat .v06-payload/part* | base64 -d | tar -xz

          # GitHub Apps without workflows permission cannot modify workflow files.
          # Keep the existing validation workflow for this assembly commit; it is
          # updated separately by the repository connector after assembly.
          git checkout -- .github/workflows/validate.yml

          rm -rf .v06-payload
          chmod +x scripts/install.sh scripts/upgrade.sh tests/platform-detection.sh

          bash -n scripts/install.sh
          bash -n scripts/upgrade.sh
          bash -n scripts/lib/common.sh
          bash -n scripts/lib/distro-rocky.sh
          bash -n scripts/lib/distro-ubuntu.sh
          bash -n tests/platform-detection.sh
          bash tests/platform-detection.sh

      - name: Commit assembled v0.6
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d .v06-payload ]]; then
            echo "Payload still present; refusing to commit."
            exit 1
          fi
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add multi-distribution installer v0.6"
          git push
