name: Apply installer 0.6.3 LAM JSON fix

on:
  push:
    branches:
      - fix/lam-json-config-0.6.3

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch helper
        run: python3 tools/apply_lam_json_063.py

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tests/lam-config-json.sh
          bash -n scripts/install.sh
          bash -n scripts/lib/common.sh
          bash -n scripts/lib/distro-rocky.sh
          bash -n scripts/lib/distro-ubuntu.sh
          bash -n tests/lam-config-json.sh
          python3 -m py_compile scripts/lib/lam_config_json.py
          ./tests/platform-detection.sh
          ./tests/ubuntu-resolver-contract.sh
          ./tests/pipefail-safety.sh
          ./tests/lam-config-json.sh

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/install.sh scripts/lib/common.sh scripts/lib/lam_config_json.py CHANGELOG.md tests/lam-config-json.sh
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: support JSON config for LAM 9.6"
          git push
