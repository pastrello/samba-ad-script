name: Apply installer 0.6.2 SIGPIPE fix

on:
  push:
    branches:
      - fix/sigpipe-provision-0.6.2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch helper
        run: python3 tools/apply_sigpipe_062.py

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tests/pipefail-safety.sh
          bash -n scripts/install.sh
          bash -n scripts/lib/common.sh
          bash -n scripts/lib/distro-rocky.sh
          bash -n scripts/lib/distro-ubuntu.sh
          bash -n tests/pipefail-safety.sh
          ./tests/platform-detection.sh
          ./tests/pipefail-safety.sh

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/install.sh scripts/lib/common.sh CHANGELOG.md tests/pipefail-safety.sh
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: avoid SIGPIPE while reading Samba build options"
          git push
