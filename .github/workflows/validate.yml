name: Validate Bash

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  syntax-and-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "bash -n $file"
            bash -n "$file"
          done < <(find scripts tests -type f -name '*.sh' -print0)

      - name: Platform adapter contract
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tests/platform-detection.sh
          ./tests/platform-detection.sh

      - name: Ubuntu resolver contract
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tests/ubuntu-resolver-contract.sh
          ./tests/ubuntu-resolver-contract.sh

      - name: Pipefail safety contract
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tests/pipefail-safety.sh
          ./tests/pipefail-safety.sh

      - name: LAM JSON config contract
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tests/lam-config-json.sh
          python3 -m py_compile scripts/lib/lam_config_json.py
          ./tests/lam-config-json.sh

      - name: Grafana provisioning permissions contract
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tests/grafana-provisioning-permissions.sh
          ./tests/grafana-provisioning-permissions.sh

      - name: Grafana CLI path contract
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tests/grafana-cli-path.sh
          ./tests/grafana-cli-path.sh

      - name: Ensure LF shell scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find scripts tests -type f -name '*.sh' -print0)
          if grep -Il $'\r' "${files[@]}"; then
            echo "CRLF detected in shell scripts"
            exit 1
          fi

  ubuntu-platform-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect real Ubuntu runner
        shell: bash
        run: |
          set -euo pipefail
          sudo ./scripts/install.sh --check-platform
